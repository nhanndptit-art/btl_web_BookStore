<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/header.css">
</head>

<body> 
    <div id="header-placeholder"></div>

    <main class="products-main">
        <div class="products-container">
            <!-- Sidebar Filters -->
            <aside class="sidebar">
                <div class="filter-section">
                    <h3 class="filter-title">
                        <i class="ph ph-funnel"></i> Filter by Category
                    </h3>
                    <div class="filter-content">
                        <label class="filter-item">
                            <input type="checkbox" name="category" value="Fiction"> Fiction
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="category" value="Biography"> Biography
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="category" value="Science"> Science
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="category" value="History"> History
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="category" value="Psychology"> Psychology
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="category" value="Business"> Business
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">
                        <i class="ph ph-user"></i> Filter by Author
                    </h3>
                    <div class="filter-content">
                        <label class="filter-item">
                            <input type="checkbox" name="author" value="J.K. Rowling"> J.K. Rowling
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="author" value="George R.R. Martin"> George R.R. Martin
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="author" value="J.R.R. Tolkien"> J.R.R. Tolkien
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="author" value="Stephen King"> Stephen King
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="author" value="Paulo Coelho"> Paulo Coelho
                        </label>
                        <label class="filter-item">
                            <input type="checkbox" name="author" value="Haruki Murakami"> Haruki Murakami
                        </label>
                    </div>
                </div>
            </aside>

            <!-- Products Grid -->
            <div class="products-content">
                <div class="page-header">
                    <h1>Store</h1>
                    <p class="page-subtitle">See everything we have to offer</p>
                </div>

                <!-- Loading Spinner -->
                <div id="loading-spinner">
                    <div></div>
                    <p>Loading products...</p>
                </div>

                <!-- Error Message -->
                <div id="error-message"></div>

                <!-- Products Container -->
                <div class="container_pg"></div>

                <!-- Pagination -->
                <div class="pagination-container"></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/header,footer.js"></script>
    <script src="js/view-detail.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
