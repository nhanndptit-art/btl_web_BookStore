<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/create_acc.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
  <div class="khung user-select">
    <form action="submit">
      <h1>StoreHau</h1>
      <div class="form-group">
      <label for="username">Tên đăng nhập hoặc email <span class="highlight">*</span></label>
      <input type="text" id="username" placeholder="Tên đăng nhập hoặc email" >

      <label for="password">Mật khẩu <span class="highlight">*</span></label>
      <div class="password-container">
        <i class="fa-solid fa-eye" id="togglePassword"></i>
        <input type="password" id="password" placeholder="Mật khẩu" >
      </div>     
      </div>
      <button type="submit" class="login-btn">Đăng nhập</button>
    </form>
    <div class="or">Hoặc</div>
    <a href="creat_acc.html" class="login-btn create-account-btn">Tạo tài khoản</a>
    <hr class="line">
    <div class="create-account">
      <a href="reset_pass.html">Quên mật khẩu?</a>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
